name: Bug report
description: Something in AlleviatedBackpacks does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Put a Pickup upgrade into a backpack
        2. Open its tab ...
        3. ...
    validations:
      required: true
  - type: input
    id: abp
    attributes:
      label: AlleviatedBackpacks version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: levilamina
    attributes:
      label: LeviLamina version
      placeholder: 26.51.7
    validations:
      required: true
  - type: input
    id: minecraft
    attributes:
      label: Minecraft version
      placeholder: 1.26.51.01
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Relevant lines from `logs/latest.log` in the game folder (lines with `[AlleviatedBackpacks]`, errors, crash reports). On a server also say whether players run the client mod and include the server log.
      render: text
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
